# Builds mistri for Android on every change to it: unit tests, lint and an unsigned debug APK.
name: Android

on:
  push:
    paths:
      - "android/**"
      - "extension/content/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "extension/content/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signature builder self-test
        run: |
          python3 - <<'PY'
          import hashlib
          open("hashes.txt", "w").write("\n".join(hashlib.sha256(str(i).encode()).hexdigest() for i in range(1200)))
          PY
          python3 android/tools/build_signatures.py hashes.txt signatures.bin
          test "$(stat -c %s signatures.bin)" -eq $((16 + 1200 * 8))
      - name: Unit tests, lint and debug build
        working-directory: android
        run: tools/ci_gradle.sh testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mistri-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/gradle-*.log
          if-no-files-found: ignore

  # Starts the real app on an Android emulator and checks that Shield works inside a real WebView.
  device-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: tools/ci_gradle.sh connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/gradle-*.log
          if-no-files-found: ignore
