# Builds paindu for Android on every change to it: unit tests, lint, an unsigned debug APK,
# and a run of the real app on an emulator.
name: paindu for Android

on:
  push:
    paths:
      - "paindu/**"
      - ".github/workflows/paindu-android.yml"
  pull_request:
    paths:
      - "paindu/**"
      - ".github/workflows/paindu-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signature builder self-test
        run: |
          python3 - <<'PY'
          import hashlib
          open("hashes.txt", "w").write("\n".join(hashlib.sha256(str(i).encode()).hexdigest() for i in range(1200)))
          PY
          python3 paindu/android/tools/build_signatures.py hashes.txt signatures.bin
          test "$(stat -c %s signatures.bin)" -eq $((16 + 1200 * 8))
      - name: Unit tests, lint and debug build
        working-directory: paindu/android
        run: tools/ci_gradle.sh testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paindu-android-debug
          path: paindu/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            paindu/android/app/build/reports/
            paindu/android/gradle-*.log
          if-no-files-found: ignore

  # Starts the real app on an Android emulator and checks that Shield works inside a real WebView.
  device-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 15: its web engine is recent enough for whush's separate profiles.
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: paindu/android
          script: tools/ci_gradle.sh connectedDebugAndroidTest
      - name: Print the recorded screens
        if: always()
        run: |
          find paindu/android/app/build/outputs -name '*.jpg' | sort | while read -r f; do
            echo "SHOT-BEGIN $(basename "$f")"
            base64 -w 3000 "$f"
            echo "SHOT-END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: |
            paindu/android/app/build/reports/androidTests/
            paindu/android/app/build/outputs/connected_android_test_additional_output/
            paindu/android/gradle-*.log
          if-no-files-found: ignore
