# Builds the malware signature file the Android app downloads, once a day, from the
# abuse.ch MalwareBazaar hash export (CC0), and publishes it on the "signatures" release.
#
# Needs one repository secret:
#   ABUSE_CH_AUTH_KEY   a free Auth-Key from https://auth.abuse.ch/
# And optionally one repository variable:
#   MALWAREBAZAAR_EXPORT_URL   the full SHA-256 export address shown on
#                              https://bazaar.abuse.ch/export/ after signing in,
#                              with {key} where the Auth-Key goes.
name: Malware signatures

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the MalwareBazaar hash export
        env:
          AUTH_KEY: ${{ secrets.ABUSE_CH_AUTH_KEY }}
          EXPORT_URL: ${{ vars.MALWAREBAZAAR_EXPORT_URL || 'https://mb-api.abuse.ch/v2/files/exports/{key}/full.csv.zip' }}
        run: |
          if [ -z "$AUTH_KEY" ]; then
            echo "::error::Add the ABUSE_CH_AUTH_KEY secret (free from https://auth.abuse.ch/) to build signatures."
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 600 \
            -o export.dat "${EXPORT_URL//\{key\}/$AUTH_KEY}"
      - name: Build the signature file
        run: python3 android/tools/build_signatures.py export.dat malware-sha256.bin
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view signatures >/dev/null 2>&1 || gh release create signatures \
            --title "Malware signatures" --prerelease \
            --notes "Fingerprints of known malware files for mistri for Android, rebuilt daily from abuse.ch MalwareBazaar (CC0). Not an app release."
          gh release upload signatures malware-sha256.bin --clobber
