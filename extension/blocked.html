<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked: dangerous site</title>
  <style>
    :root { --bg:#fbf6f3; --card:#fff; --ink:#22201f; --muted:#6c6460; --warn:#a3471e; --line:#ecdcd3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1514; --card:#241d1b; --ink:#efe8e4; --muted:#a99b94; --warn:#e48a5d; --line:#3a2e2a; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font:15px/1.5 "Segoe UI", system-ui, sans-serif; padding:16px; box-sizing:border-box; }
    main { max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
    h1 { margin:0 0 6px; font-size:22px; color:var(--warn); }
    code { background:var(--bg); padding:2px 6px; border-radius:5px; word-break:break-all; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
    button { font:inherit; padding:9px 16px; border-radius:8px; cursor:pointer; border:1px solid var(--line);
             background:transparent; color:var(--ink); }
    #back { background:var(--warn); border-color:var(--warn); color:#fff; font-weight:600; }
    p.small { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1>This site was blocked</h1>
    <p><code id="host">this site</code> is on a public list of sites that spread malware or scams
       (abuse.ch URLhaus / uBlock Badware).</p>
    <p class="small">mistri Shield stopped the page before anything loaded.</p>
    <div class="row">
      <button id="back">Go back to safety</button>
      <button id="proceed" hidden>I understand the risk – open it this session</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
